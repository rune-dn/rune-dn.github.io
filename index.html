<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>룬 사전</title>
<meta name="description" content="실제 룬 문자로 만든 판타지 룬 사전과 룬 대결">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e9ebee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="룬 사전">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+Runic&display=swap">
<style>
:root{--bg:#e9ebee;--card:#f6f7f9;--ink:#1c2230;--mute:#566074;--line:#cfd4dc;--el:#1b767c;--ef:#9a6a18;--fo:#7a4fb0;--buf:#b0560f;--heal:#2e7a39;--ctl:#2f5cb0;--mys:#a8367a;--rune:#243049;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a26;--card:#1d2536;--ink:#e6e9f0;--mute:#9aa4b8;--line:#2c3650;--el:#52c3c9;--ef:#e0b058;--fo:#b995ec;--buf:#f0a35a;--heal:#72c77f;--ctl:#86a8f2;--mys:#f08cc4;--rune:#dfe6f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a26;--card:#1d2536;--ink:#e6e9f0;--mute:#9aa4b8;--line:#2c3650;--el:#52c3c9;--ef:#e0b058;--fo:#b995ec;--buf:#f0a35a;--heal:#72c77f;--ctl:#86a8f2;--mys:#f08cc4;--rune:#dfe6f5;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 'Noto Serif KR','Gowun Batang',serif;padding:16px 16px 300px;max-width:880px;margin:0 auto}
h1{font-size:28px;margin:8px 0 2px;letter-spacing:.02em}
/* 제목은 새긴 듯한 함렛, 본문은 또렷한 노토 세리프 */
h1,h2,.pt{font-family:'Hahmlet','Noto Serif KR',serif;font-weight:700}
.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.playbtn{display:inline-block;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;font-size:15px;padding:9px 14px;border-radius:10px;white-space:nowrap}
.playbtn:focus-visible{outline:2px solid var(--ef);outline-offset:2px}
.sub{color:var(--mute);margin:0 0 14px;font-size:14px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:inherit;font-size:17px;font-weight:700;padding:8px 14px;cursor:pointer;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ef)}
.tab small{font-weight:400;font-size:13px;margin-left:4px}
input{width:100%;padding:12px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--ef);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#subs{display:none}
#subs.on{display:flex}
.cnt{color:var(--mute);font-size:13px;margin:14px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.tile{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer}
.tile:active{background:var(--line)}
.tile[data-c="원소"]{--c:var(--el)}
.tile[data-c="술식"]{--c:var(--ef)}
.tile[data-c="발현"]{--c:var(--fo)}
.tile[data-g="증강"]{--c:var(--buf)}.tile[data-g="가호"]{--c:var(--heal)}.tile[data-g="지배"]{--c:var(--ctl)}.tile[data-g="비술"]{--c:var(--mys)}
.h{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.g{font:400 40px/1.1 'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;color:var(--rune)}
.t{font-size:12px;color:var(--c);font-weight:700;padding-top:4px}
.k{font-size:19px;font-weight:700;margin-top:6px}
.n{font-size:14px;color:var(--mute)}
.o{font-size:12px;color:var(--mute);margin-top:2px}
.empty{grid-column:1/-1;color:var(--mute);padding:24px 0}
[hidden]{display:none!important}
.prog{display:flex;gap:16px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.prog div{font-size:13px;color:var(--mute)}
.prog b{display:block;font-size:22px;color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ef)}
.store{font-size:12px;color:var(--mute);margin:0}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.tb.warn{color:#c2414b;border-color:#c2414b}
.tb.warn.armed{background:#c2414b;color:#fff}
.list{display:grid;gap:10px;margin-top:12px}
.entry{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.eg{font:400 28px/1.2 'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;color:var(--rune);letter-spacing:3px;grid-column:1/-1}
.en{font-size:19px;font-weight:700}
.ek{font-size:14px;color:var(--mute)}
.ed{font-size:14px;grid-column:1/-1}
.eb{display:flex;gap:6px;grid-column:1/-1;margin-top:4px;flex-wrap:wrap;align-items:center}
.eb span{font-size:12px;color:var(--mute);margin-right:auto}
.grade{font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:999px;padding:1px 8px;white-space:nowrap}
.g1{color:var(--mute)}.g2{color:var(--el)}.g3{color:var(--ef)}.g4{color:var(--fo)}.g5{color:#c2414b}
.tray{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));max-height:60vh;overflow:auto}
.in{max-width:880px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tg{font:400 30px/1.2 'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;color:var(--rune);letter-spacing:4px;min-width:34px}
.r{flex:1;min-width:140px;font-size:16px;font-weight:700}
.r small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.tb{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;cursor:pointer}
.tb.main{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.tb:disabled{opacity:.5;cursor:default}
.ab{max-width:880px;margin:0 auto 10px;padding:10px 12px;border:1px solid var(--line);border-left:6px solid var(--ef);border-radius:10px;background:var(--bg)}
.abh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.abn{font-size:18px;font-weight:700}
.new{font-size:12px;font-weight:700;color:var(--el)}
.abd{font-size:15px;margin-top:2px}
.abx{font-size:13px;color:var(--mute);margin-top:4px}
.abx.w{color:var(--ef);font-weight:700}
.ab.fail{border-left-color:#c2414b}
.ab.fail .abn{color:#c2414b}
.tile{touch-action:manipulation}
.tray{z-index:5}
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:16px}
@media (min-width:600px){.ov{align-items:center}}
.pn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:85vh;overflow:auto;padding:18px 20px}
.pnh{display:flex;gap:16px;align-items:center}
.pg{font:400 64px/1 'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;color:var(--rune);min-width:48px;text-align:center}
.pt{font-size:22px;font-weight:700;margin:0}
.ps{font-size:13px;color:var(--mute)}
.pd{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0;font-size:15px}
.pd dt{color:var(--mute)}
.pd dd{margin:0}
.pp{font-size:15px;line-height:1.75;margin:0}
.pf{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.pts{font-size:12px;color:var(--mute)}
.boom{font-size:12px;font-weight:700;color:#fff;background:#c2414b;border-radius:999px;padding:1px 8px}
.badges{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.old{font-size:12px;color:#c2414b;margin-right:auto}
.rule{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.rule h3{font-size:17px;margin:0 0 6px}
.rule p,.rule li{font-size:15px;margin:4px 0}
.rule ul{padding-left:20px;margin:6px 0}
.chip.boomchip:not([aria-pressed=true]){color:#c2414b;border-color:#c2414b}
.tile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ed,.abd{white-space:pre-wrap}
.fl{display:block;font-size:13px;color:var(--mute);margin:14px 0 6px}
.pn input,.pn textarea{background:var(--bg)}
textarea{width:100%;padding:12px 14px;border:1px solid var(--line);color:var(--ink);border-radius:10px;font:inherit;line-height:1.6;resize:vertical}
textarea:focus-visible{outline:2px solid var(--ef);outline-offset:2px}
#ed-g{font-size:34px;letter-spacing:2px;min-width:0}
.wres{height:44px;overflow:hidden;margin-bottom:8px}
.wres .abx{margin:2px 0}
.wchips .lbl{font-size:12px;color:var(--mute);align-self:center;white-space:nowrap}
.tray.compact .abd,.tray.compact .abx{display:none}
.whint{font-size:14px;color:var(--mute);margin:4px 0}
.wbest{display:flex;align-items:center;gap:12px;font-size:17px;font-weight:700}
.wg{font:400 44px/1 'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;color:var(--rune)}
.wchips{flex-wrap:nowrap;overflow-x:auto;margin-top:6px;padding-bottom:2px}
.wchips .chip{white-space:nowrap}
.pad-row{display:flex;gap:8px;justify-content:center;align-items:flex-start}
.wside{width:72px;flex:none;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.walts{display:flex;flex-direction:column;gap:6px}
.wbtns{display:flex;flex-direction:column;gap:6px}
.wbtns .tb{width:100%;padding:8px 4px}
#pad{flex:none}
.walts .lbl{font-size:12px;color:var(--mute);text-align:center;margin-top:4px}
.walt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-size:12px;line-height:1.3;cursor:pointer;word-break:keep-all;text-align:center}
.walt b{font:400 26px/1.1 'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;color:var(--rune)}
#pad{display:block;touch-action:none;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:crosshair}
.padbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.padbtns .tb{background:var(--bg);padding:6px 10px}
.wref{margin-top:12px}
.wref summary{cursor:pointer;color:var(--mute);font-size:14px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.wcat{font-size:13px;font-weight:700;margin:12px 0 6px}
.wcat[data-c="원소"]{color:var(--el)}.wcat[data-c="술식"]{color:var(--ef)}.wcat[data-c="발현"]{color:var(--fo)}
.wgrid div[data-c="원소"]{border-left:3px solid var(--el)}.wgrid div[data-c="술식"]{border-left:3px solid var(--ef)}.wgrid div[data-c="발현"]{border-left:3px solid var(--fo)}
.wgrid div[data-g="증강"]{border-left-color:var(--buf)}.wgrid div[data-g="가호"]{border-left-color:var(--heal)}.wgrid div[data-g="지배"]{border-left-color:var(--ctl)}.wgrid div[data-g="비술"]{border-left-color:var(--mys)}
.wgrid div{background:var(--card);border:1px solid var(--line);border-radius:8px;text-align:center;padding:4px 2px;font-size:12px;color:var(--mute)}
.wgrid b{display:block;font:400 26px/1.2 'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;color:var(--rune)}
</style>
</head>
<body>
<div class="titlebar"><h1>룬 사전</h1><a class="playbtn" id="playbtn" href="duel.html" target="_blank">룬 대결 하기</a></div>
<p class="sub">룬을 원소 → 술식 → 발현 순서로 눌러 조합하면 능력이 나오고, 기록한 조합은 도감에 모여요. 룬을 길게 누르면 실제 뜻과 역사를 볼 수 있어요.</p>
<div class="tabs" role="tablist">
<button class="tab" role="tab" id="t-dict" aria-selected="true">사전</button>
<button class="tab" role="tab" id="t-write" aria-selected="false">각인</button>
<button class="tab" role="tab" id="t-codex" aria-selected="false">도감<small id="tcnt"></small></button>
<button class="tab" role="tab" id="t-rules" aria-selected="false">규칙</button>
</div>
<section id="v-dict">
<input id="q" type="search" placeholder="예: 불, 카우나, ᚲ" aria-label="룬 검색">
<div class="chips" id="cats"></div>
<div class="chips" id="subs"></div>
<p class="cnt" id="cnt"></p>
<div class="grid" id="grid"></div>
</section>
<section id="v-write" hidden>
<div class="wres" id="wres" aria-live="polite"><p class="whint">룬 하나를 그리고 잠시 기다리면 알아보고 조합에 넣어요.</p></div>
<div class="pad-row"><canvas id="pad" aria-label="룬을 그리는 판"></canvas><div class="wside"><div class="walts" id="walts" aria-live="polite"></div><div class="wbtns"><button class="tb" id="wgo" type="button">알아보기</button><button class="tb" id="wclear" type="button">지우기</button></div></div></div>
<details class="wref"><summary>룬 모양 보기</summary><div id="wgrid"></div></details>
</section>
<section id="v-codex" hidden>
<div class="prog" id="prog"></div>
<div class="srow"><p class="store" id="store"></p><button class="tb warn" id="reset" type="button" hidden>기록 초기화</button></div>
<input id="cq" type="search" placeholder="도감에서 이름이나 키워드로 찾기" aria-label="도감 검색" style="margin-top:12px">
<div class="chips" id="gchips" role="group" aria-label="등급으로 보기"></div>
<div class="list" id="list"></div>
</section>
<section id="v-rules" hidden><div id="rules"></div></section>
<div class="ov" id="ov" hidden><div class="pn" role="dialog" aria-modal="true" aria-labelledby="pt">
<div class="pnh"><div class="pg" id="pg"></div><div><h2 class="pt" id="pt"></h2><div class="ps" id="ps"></div></div></div>
<dl class="pd" id="pd"></dl>
<p class="pp" id="pp"></p>
<div class="pf"><button class="tb" id="padd" type="button">조합에 넣기</button><button class="tb main" id="pclose" type="button">닫기</button></div>
</div></div>
<div class="ov" id="eo" hidden><div class="pn" role="dialog" aria-modal="true" aria-labelledby="ed-t">
<div class="pnh"><div class="pg" id="ed-g"></div><div><h2 class="pt" id="ed-t"></h2><div class="ps" id="ed-s"></div></div></div>
<label class="fl" for="ed-name">이름</label>
<input id="ed-name" maxlength="40" autocomplete="off">
<label class="fl" for="ed-lore">능력 설정</label>
<textarea id="ed-lore" maxlength="600" rows="6"></textarea>
<p class="ps" id="ed-msg" role="status"></p>
<div class="pf"><button class="tb" id="ed-reset" type="button" style="margin-right:auto">기본값으로</button><button class="tb" id="ed-cancel" type="button">취소</button><button class="tb main" id="ed-save" type="button">저장</button></div>
</div></div>
<div class="tray"><div class="ab" id="ab" hidden></div><div class="in">
<div class="tg" id="tg"></div>
<div class="r"><span id="tr"></span><small id="hint"></small></div>
<button class="tb main" id="rec" disabled>도감에 기록</button>
<button class="tb" id="undo">되돌리기</button>
<button class="tb" id="clr">비우기</button>
</div></div>
<script>
const D=[
['ᚲ','카우나','불','원소','','횃불'],
['ᛡ','이오르','물','원소','','강물고기'],
['ᚫ','애스크','바람','원소','','물푸레나무'],
['ᛠ','에아르','땅','원소','','흙·무덤'],
['ᚸ','가르','번개','원소','','창'],
['ᚪ','아크','나무','원소','','참나무'],
['ᚢ','우루즈','원초적 힘','술식','증강','들소'],
['ᛞ','다가즈','각성','술식','증강','낮·하루'],
['ᚠ','페후','증폭','술식','증강','재물'],
['ᛏ','티와즈','맹세','술식','증강','전쟁의 신'],
['ᛒ','베르카나','성장','술식','증강','자작나무'],
['ᛜ','잉와즈','잠재력','술식','증강','풍요의 신'],
['ᚹ','우은조','치유','술식','가호','기쁨'],
['ᛇ','에이와즈','부활','술식','가호','주목나무'],
['ᛊ','소윌로','정화','술식','가호','태양'],
['ᛉ','알기즈','수호','술식','가호','엘크·사초'],
['ᛁ','이사','정지','술식','지배','얼음'],
['ᚾ','나우티즈','속박','술식','지배','필요'],
['ᛃ','예라','흡수','술식','지배','수확'],
['ᚷ','게보','계약','술식','증강','선물'],
['ᛗ','만나즈','정신','술식','비술','인간'],
['ᚨ','안수즈','예언','술식','비술','신'],
['ᛈ','페르트','변환','술식','비술','뜻 미상(놀이?)'],
['ᚱ','라이도','이동','술식','가호','여행'],
['ᚺ','하갈라즈','재앙','발현','','우박'],
['ᛖ','에와즈','소환','발현','','말'],
['ᛟ','오달라','영역','발현','','유산'],
['ᚦ','투리사즈','방어','발현','','거인'],
['ᛚ','라구즈','환영','발현','','물']
];
/* 룬 조합 이름 (짧게): [꾸밈말 하나] [원소 낱말] [발현 낱말] */
const NM=(()=>{
const E=['불','물','바람','땅','번개','나무'];

'ᚹ':['*wunjō','w','기쁨',EF24+' 8번째 · 첫째 무리','고대 영어 룬 시는 “슬픔과 고통을 모르고 풍족하게 사는 이에게 기쁨이 있다”고 해요. 이 룬은 고대 영어를 라틴 문자로 적을 때 w 소리 글자 ƿ(윈)로 빌려 쓰여 중세까지 남았어요. 영거 푸타르크에서는 사라졌어요.'],
'ᚺ':['*hagalaz','h','우박',EF24+' 9번째 · 둘째 무리의 첫 룬','영어 hail과 같은 뿌리예요. 룬 시들은 “우박은 가장 흰 곡식, 하늘에서 쏟아져 바람에 휘날리다 결국 물이 된다”고 노래해요. 한순간에 농사를 망치는 파괴와, 그 뒤에 오는 변화를 함께 담은 룬이에요.'],
'ᚾ':['*naudiz','n','필요, 고난',EF24+' 10번째 · 둘째 무리','영어 need와 같은 뿌리예요. 고대 영어 룬 시는 “필요는 가슴을 조이지만, 일찍 귀 기울이면 도움과 구원이 된다”고 하고, 노르드 룬 시는 속박된 자의 굴레를 노래해요. 이 사전의 ‘속박’은 여기서 왔어요.'],
'ᛁ':['*īsaz','i','얼음',EF24+' 11번째 · 둘째 무리','영어 ice와 같은 뿌리예요. 룬 시들은 얼음을 “강 위의 넓은 다리”, “유리처럼 반짝이는 보석 같은 바닥”으로 묘사해요. 획 하나로만 된 가장 단순한 룬이에요.'],
'ᛃ':['*jēra','j(영어 y 소리)','해(年), 풍년',EF24+' 12번째 · 둘째 무리','영어 year와 같은 뿌리예요. 고대 영어 룬 시는 “신이 땅에 밝은 열매를 내려 부자와 가난한 이 모두에게 주는 때”라고 노래해요. 이 사전의 ‘흡수’는 결실을 거두어들인다는 뜻에서 왔어요.'],
'ᛇ':['*eihwaz / *īwaz','미상(ï 또는 æ로 추정)','주목나무',EF24+' 13번째 · 둘째 무리','주목은 수천 년을 살고 독이 있으며 활을 만드는 나무였어요. 고대 영어 룬 시는 “겉은 거칠지만 단단히 뿌리내리고 불을 지키는 나무”라고 해요. 오래 사는 나무라서 이 사전에서는 ‘부활’이 됐어요. 원래 어떤 소리였는지는 지금도 논쟁 중이에요.'],
'ᛈ':['*perþ- (불확실)','p','뜻 미상',EF24+' 14번째 · 둘째 무리','24룬 중 뜻이 가장 수수께끼인 룬이에요. 고대 영어 룬 시만 peorð를 언급하는데, “용사들이 술자리에서 웃고 즐기는 것”이라고 해서 주사위 컵이나 놀이 판으로 추측해요. 비문에도 드물게 나와요. 이 사전의 ‘변환’은 운을 건 주사위 놀이 해석에서 왔어요.'],
'ᛉ':['*algiz (불확실)','z(후기에 r 소리)','엘크 또는 사초로 추정',EF24+' 15번째 · 둘째 무리','원래 이름은 확실하지 않아요. 고대 영어 룬 시는 eolhx(사초, 늪지 풀)를 “물가에 자라 붙잡는 이를 피투성이로 만드는 날카로운 풀”로 묘사해요. 날카로운 풀이 스스로를 지키듯 ‘보호’라는 뜻은 현대에 더해진 해석이에요. 단어 끝의 z 소리를 적던 룬인데, 이 소리는 나중에 r과 합쳐졌어요.'],
'ᛊ':['*sōwilō','s','태양',EF24+' 16번째 · 둘째 무리','룬 시들은 태양을 “땅의 빛”, “바다를 건너는 뱃사람들의 희망”으로 노래해요. 모든 것을 비추고 어둠을 걷어내는 빛이라서 이 사전에서는 ‘정화’가 됐어요.'],
'ᛏ':['*tīwaz','t','티르 신',EF24+' 17번째 · 셋째 무리의 첫 룬','법과 전쟁의 신 티르(Týr)를 가리키며, 화요일(Tuesday)의 어원이에요. 신화에서 티르는 늑대 펜리르를 묶기 위해 한 손을 내주었어요. 『시의 에다』에는 승리를 원하면 칼에 룬을 새기고 티르의 이름을 두 번 부르라는 구절이 있어요. 이 사전의 ‘맹세’는 희생을 감수한 티르의 이야기에서 왔어요.'],
'ᛒ':['*berkanan','b','자작나무',EF24+' 18번째 · 셋째 무리','영어 birch와 같은 뿌리예요. 룬 시들은 “잎이 가장 푸른 가지”를 노래해요. 자작나무는 봄에 가장 먼저 잎을 틔우는 나무라 새 생명과 출발의 상징으로 여겨졌고, 이 사전에서는 ‘성장’이 됐어요.'],
'ᛖ':['*ehwaz','e','말(馬)',EF24+' 19번째 · 셋째 무리','라틴어 equus(말)와 같은 뿌리예요. 고대 영어 룬 시는 “말은 귀족들의 기쁨, 발굽을 자랑하는 말 위에서 용사는 당당하다”고 노래해요. 타고 다니는 동반자라서 이 사전에서는 ‘소환’이 됐어요. 영거 푸타르크에서는 사라졌어요.'],
'ᛗ':['*mannaz','m','사람',EF24+' 20번째 · 셋째 무리','영어 man과 같은 뿌리예요. 고대 영어 룬 시는 “사람은 기쁨 속에서 친족에게 사랑받지만, 결국엔 서로 떠나야 한다”고 해요. 사람의 마음과 지성을 담아 이 사전에서는 ‘정신’이 됐어요.'],
'ᛚ':['*laguz / *laukaz','l','물, 호수 (또는 부추)',EF24+' 21번째 · 셋째 무리','룬 시들은 바다·폭포·호수를 노래하며, 고대 영어 룬 시는 험한 파도 위의 뱃사람을 그려요. 다른 해석으로는 ‘부추(laukaz)’가 있는데, 부추는 다산과 보호의 상징이라 부적 비문에 자주 나와요. 일렁이는 물결의 이미지로 이 사전에서는 ‘환영’이 됐어요.'],
'ᛜ':['*ingwaz','ng(ŋ)','잉(Ing) 신',EF24+' 22번째 · 셋째 무리','풍요의 신 프레이르의 다른 이름인 잉비(Yngvi)와 관련돼요. 고대 영어 룬 시는 “잉은 동쪽 데인족 사이에서 처음 사람들에게 보였다”고 해요. 씨앗을 품은 풍요의 뜻으로 이 사전에서는 ‘잠재력’이 됐어요.'],
'ᛞ':['*dagaz','d','낮, 하루',EF24+' 23번째 · 셋째 무리','영어 day와 같은 뿌리예요. 고대 영어 룬 시는 “낮은 주인이 보낸 빛, 모두에게 희망과 기쁨”이라고 해요. 이 사전의 ‘각성’은 어둠이 끝나고 낮이 밝아오는 새벽의 이미지에서 왔어요.'],
'ᛟ':['*ōþala','o','물려받은 땅, 고향',EF24+' 24번째 · 셋째 무리','고대 영어 룬 시는 “자기 집에서 풍요를 누리는 것은 누구에게나 소중하다”고 해요. 조상에게 물려받아 지키는 땅이라서 이 사전에서는 ‘영역’이 됐어요. 비문에 따라 ᛞ와 ᛟ의 순서가 서로 바뀌어 나타나서, 어느 쪽이 마지막 룬인지는 정해져 있지 않아요.'],
'ᚪ':['āc','a','참나무',AS+' 추가 룬','고대 영어에서 모음이 변하면서 ᚨ 안수즈 계열에서 갈라져 나온 룬이에요. 고대 영어 룬 시는 “참나무는 땅에서 도토리로 돼지를 살찌우고, 바다 위에서는 배가 되어 그 굳건함을 시험받는다”고 노래해요. 이 사전에서는 ‘나무’ 원소가 됐어요.'],
'ᚫ':['æsc','æ','물푸레나무',AS+' 추가 룬','ᚪ 아크처럼 ᚨ 안수즈에서 갈라져 나온 룬이에요. 고대 영어 룬 시는 “물푸레나무는 아주 높고 사람들에게 귀하며, 단단히 버티며 많은 이와 맞서 싸운다”고 해요. 창 자루를 물푸레나무로 만들었기 때문이에요. 북유럽 신화의 세계수 이그드라실도 물푸레나무로 전해져요. 바람에 흔들리는 키 큰 나무라서 이 사전에서는 ‘바람’이 됐어요.'],
'ᛠ':['ēar','ea','흙, 무덤 (추정)',AS+' 추가 룬','고대 영어 룬 시의 마지막 연에 나오는 룬으로, “육신이 식어 땅을 반려로 삼을 때, 모든 용사에게 무덤은 두렵다”고 노래해요. 정확한 뜻은 연구자마다 의견이 다르지만, 대체로 흙이나 무덤으로 봐요. 이 사전에서는 ‘땅’ 원소가 됐어요.'],
'ᛡ':['īor','io','강물고기 (비버나 장어로 추정)',AS+' 추가 룬','고대 영어 룬 시는 “물에 살면서 뭍에서 먹이를 얻는 강물고기, 물에 둘러싸인 아름다운 집에서 즐겁게 산다”고 해요. 어떤 동물인지는 분명하지 않아서 비버, 장어, 심지어 북유럽 신화의 바다뱀까지 여러 해석이 있어요. 물과 땅을 오가는 생물이라 이 사전에서는 ‘물’ 원소가 됐어요.'],
'ᚸ':['gār','g(단단한 g 소리)','창',AS+' 추가 룬','고대 영어 룬 시에는 없고, 잉글랜드 북부 노섬브리아에서 가장 나중에 더해진 룬들 가운데 하나예요. 고대 영어에서 g 소리가 여러 갈래로 나뉘자, 원래의 단단한 g를 따로 적기 위해 만들어진 것으로 보여요. 하늘에서 내리꽂는 창의 이미지로 이 사전에서는 ‘번개’ 원소가 됐어요.']
};
let infoIx=null,infoBack=null,lastTap={};
function openInfo(i){
  const r=D[i],f=INFO[r[0]];if(!f)return;
  infoIx=i;infoBack=document.activeElement;
  $('#pg').textContent=r[0];$('#pt').textContent=r[1]+' · '+r[2];$('#ps').textContent=f[3];
  const dl=$('#pd');dl.replaceChildren();
  [['원래 이름',f[0]],['소리',f[1]],['실제 뜻',f[2]],['이 사전에서',r[2]+' ('+r[3]+(r[4]?' · '+r[4]:'')+')']].forEach(([a,b])=>dl.append(el('dt',null,a),el('dd',null,b)));
  $('#pp').textContent=f[4];
  $('#ov').hidden=false;$('#pclose').focus();
}
function closeInfo(){$('#ov').hidden=true;infoIx=null;if(infoBack&&infoBack.focus)infoBack.focus()}
let cat='전체',sub='전체',q='',cq='',cg='',T=[],tab='dict';
/* 도감: 키 -> 처음 기록한 시각 */
let codex=new Map(),store=null,storeMsg='';
const $=s=>document.querySelector(s);
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function chips(box,items,get,set){
  box.replaceChildren();
  items.forEach(n=>{
    const b=el('button','chip',n);b.type='button';
    b.setAttribute('aria-pressed',String(get()===n));
    b.onclick=()=>{set(n);build();render()};
    box.append(b);
  });
}
function build(){
  chips($('#cats'),['전체','원소','술식','발현'],()=>cat,n=>{cat=n;sub='전체'});
  $('#subs').classList.toggle('on',cat==='술식');
  chips($('#subs'),['전체','증강','가호','지배','비술'],()=>sub,n=>{sub=n});
}
function render(){
  const g=$('#grid');g.replaceChildren();
  const list=D.map((r,i)=>[r,i]).filter(([r])=>(cat==='전체'||r[3]===cat)&&(sub==='전체'||r[4]===sub)&&(!q||(r[0]+r[1]+r[2]+r[5]).includes(q))).sort((a,b)=>VORD(...a)-VORD(...b));
  $('#cnt').textContent=list.length+'개의 룬';
  if(!list.length){g.append(el('p','empty','일치하는 룬이 없어요. 키워드나 이름으로 다시 검색해 보세요.'));return}
  list.forEach(([r,i])=>{
    const b=el('button','tile');b.type='button';b.dataset.c=r[3];b.dataset.g=r[4]||r[3];
    const h=el('div','h');h.append(el('div','g',r[0]),el('div','t',r[4]||r[3]));
    b.append(h,el('div','k',r[2]),el('div','n',r[1]),el('div','o','원래 뜻: '+r[5]));
    b.title='눌러서 조합, 길게 눌러서 실제 뜻 보기';
    /* 길게 누르기(0.5초) 또는 오른쪽 클릭: 정보 창. 손가락이 움직이면(스크롤) 취소 */
    let timer=null,sx=0,sy=0,fired=false;
    const cancel=()=>clearTimeout(timer);
    b.addEventListener('pointerdown',e=>{if(e.button)return;fired=false;sx=e.clientX;sy=e.clientY;cancel();timer=setTimeout(()=>{fired=true;openInfo(i)},500)});
    b.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-sx)>10||Math.abs(e.clientY-sy)>10)cancel()});
    ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,cancel));
    b.addEventListener('contextmenu',e=>{e.preventDefault();cancel();if(!fired&&$('#ov').hidden)openInfo(i);fired=true});
    b.onclick=()=>{if(fired){fired=false;return}if(T.length<5)T.push(i);tray(T.length>=5)};
    g.append(b);
  });
}
function gradeEl(n){return el('span','grade g'+n,GRADE[n])}
function tray(full){
  const ab=$('#ab'),rec=$('#rec');
  $('.tray').hidden=!T.length; /* 조합 칸은 룬을 넣었을 때만 보여요 */
  $('#tg').textContent=T.map(i=>D[i][0]).join('');
  $('#tr').textContent=T.length?T.map(i=>KW[i]).join(' + '):(tab==='write'?'룬을 그려 조합해 보세요':'룬을 눌러 조합해 보세요');
  $('#hint').textContent=full?'최대 5개까지 쌓을 수 있어요':(T.length?T.map(i=>D[i][1]).join(', '):'원소, 술식, 발현 순서로 고르면 돼요');
  if(!T.length){ab.hidden=true;rec.disabled=true;rec.textContent='도감에 기록';return}
  ab.hidden=false;ab.replaceChildren();
  const fail=failOf(T);
  ab.classList.toggle('fail',!!fail);
  if(fail){
    rec.disabled=true;rec.textContent='조합 실패';
    const hd=el('div','abh');hd.append(el('span','abn','조합 실패'));
    ab.append(hd,el('div','abd',fail[0]),el('div','abx w',fail[1]));
    return;
  }
  const rc=codex.get(keyOf(T)),known=!!rc,opp=oppOf(T);
  rec.disabled=false;rec.textContent=known?'설정 수정':'도감에 기록';
  const hd=el('div','abh');hd.append(el('span','abn',(rc&&rc.name)||nameOf(T)),gradeEl(gradeOf(T)),el('span','pts','위력 '+pw(T)));
  if(opp.length)hd.append(el('span','boom','폭주'));
  if(!known)hd.append(el('span','new','새 조합'));
  ab.append(hd);
  ab.append(el('div','abd',(rc&&rc.lore)||autoLore(T)));
  if(opp.length)ab.append(el('div','abx w',opp.map(([a,b])=>a+' ↔ '+b).join(', ')+': 반대되는 룬이 섞였어요.'));
  notes(T).forEach(([t,w])=>ab.append(el('div',w?'abx w':'abx',t)));
}
function fmt(at){try{return new Date(at).toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'})}catch(e){return ''}}
function renderCodex(){
  $('#tcnt').textContent=codex.size?' '+codex.size:'';
  const entries=[...codex.entries()].map(([k,v])=>{const ix=k.split(',').map(Number);return {k,at:v.at,name:v.name,lore:v.lore,ix,ok:!failOf(ix),g:gradeOf(ix),boom:oppOf(ix).length>0}}).sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const live=entries.filter(e=>e.ok),found=live.length,total=TOTAL_VALID;
  const p=$('#prog');p.replaceChildren();
  const box=(label,val)=>{const d=el('div',null,label);d.prepend(el('b',null,val));return d};
  const pct=el('div');pct.style.flex='1';pct.style.minWidth='160px';
  pct.append(el('b',null,found.toLocaleString('ko-KR')+' / '+total.toLocaleString('ko-KR')),'발견한 조합');
  const bar=el('div','bar'),fill=el('i');fill.style.width=(found?Math.max(found/total*100,1):0)+'%';bar.append(fill);pct.append(bar);
  p.append(pct,box('전설 조합',String(live.filter(e=>e.g===5).length)),box('폭주 조합',String(live.filter(e=>e.boom).length)));
  $('#store').textContent=storeMsg;
  $('#reset').hidden=!entries.length;
  const gc=$('#gchips');gc.replaceChildren();gc.hidden=!entries.length;
  GRADE.slice(1).forEach((g,i)=>{
    const n=i+1,c=entries.filter(e=>e.g===n).length;
    const b=el('button','chip g'+n,g+' '+c);b.type='button';
    b.setAttribute('aria-pressed',String(cg===g));
    b.title=cg===g?'한 번 더 누르면 모두 보기':g+' 등급만 보기';
    b.onclick=()=>{cg=cg===g?'':g;renderCodex()};
    gc.append(b);

  if(name===nameOf(ix))name='';
  if(lore===autoLore(ix))lore='';
  btn.disabled=true;
  const ok=await saveEntry(edKey,name,lore);
  btn.disabled=false;
  if(ok)closeEditor();else $('#ed-msg').textContent='저장하지 못했어요. 잠시 후 다시 눌러주세요.';
}
async function removeEntry(k){
  if(store){try{await store.doc('c'+k.replace(/,/g,'_')).delete()}catch(e){storeMsg='삭제하지 못했어요. 잠시 후 다시 시도해 주세요.';renderCodex();return}}
  codex.delete(k);if(!store)saveLocal();tray();renderCodex();
}
let armTimer=null,resetting=false;
function disarm(){clearTimeout(armTimer);const b=$('#reset');b.classList.remove('armed');b.textContent='기록 초기화'}
async function resetAll(){
  const b=$('#reset');
  if(resetting)return;
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='모든 기록이 지워져요. 한 번 더 누르면 초기화'; armTimer=setTimeout(disarm,4000);return}
  disarm();resetting=true;b.disabled=true;b.textContent='초기화하는 중…';
  const keys=[...codex.keys()];let failed=0;
  if(store){for(const k of keys){try{await store.doc('c'+k.replace(/,/g,'_')).delete();codex.delete(k)}catch(e){failed++}}}
  else{codex.clear();saveLocal()}
  resetting=false;b.disabled=false;b.textContent='기록 초기화';
  if(failed)storeMsg=failed+'개를 지우지 못했어요. 다시 눌러 남은 기록을 초기화하세요.';
  tray();renderCodex();
}
loadLocal();storeMsg='기록은 이 기기의 브라우저에 저장돼요. 다른 기기에서는 따로 모여요.';
$('#q').addEventListener('input',e=>{q=e.target.value.trim();render()});
$('#cq').addEventListener('input',e=>{cq=e.target.value.trim();renderCodex()});
$('#t-dict').onclick=()=>show('dict');
$('#t-codex').onclick=()=>show('codex');
$('#t-rules').onclick=()=>show('rules');
$('#t-write').onclick=()=>show('write');
{
  const pad=$('#pad');
  pad.addEventListener('pointerdown',e=>{e.preventDefault();clearTimeout(wTimer);try{pad.setPointerCapture(e.pointerId)}catch(_){}wCur=[padPoint(e)];drawPad()});
  pad.addEventListener('pointermove',e=>{if(!wCur)return;const p=padPoint(e),l=wCur[wCur.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])>=2){wCur.push(p);drawPad()}});
  const endStroke=()=>{if(!wCur)return;wStrokes.push(wCur);wCur=null;drawPad();clearTimeout(wTimer);wTimer=setTimeout(readPad,900)};
  pad.addEventListener('pointerup',endStroke);pad.addEventListener('pointercancel',endStroke);
  $('#wclear').onclick=()=>{clearTimeout(wTimer);wStrokes=[];wCur=null;drawPad()};
  $('#wgo').onclick=readPad;
  window.addEventListener('resize',()=>{if(tab==='write')setupPad()});
}
$('#rec').onclick=()=>{if(T.length&&!$('#rec').disabled&&!failOf(T))openEditor(keyOf(T))};
$('#ed-save').onclick=saveEditor;
$('#ed-cancel').onclick=closeEditor;
$('#ed-reset').onclick=()=>{if(!edKey)return;const ix=edKey.split(',').map(Number);$('#ed-name').value=nameOf(ix);$('#ed-lore').value=autoLore(ix)};
$('#reset').onclick=resetAll;
$('#pclose').onclick=closeInfo;
$('#padd').onclick=()=>{const i=infoIx;closeInfo();if(i!=null&&T.length<5){T.push(i);tray(T.length>=5)}};
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeInfo()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#eo').hidden)closeEditor();else if(!$('#ov').hidden)closeInfo()});
$('#undo').onclick=()=>{T.pop();tray()};
$('#clr').onclick=()=>{T=[];tray()};
build();render();tray();renderCodex();
// 앱으로 설치해 열었을 때는 대결도 같은 창에서 열어요
try{if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)$('#playbtn').removeAttribute('target')}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){/* 앱 파일이 새 버전으로 바뀌면 한 번 자동으로 새로고침해요 */const sw=navigator.serviceWorker,had=!!sw.controller;let done=false;sw.addEventListener('controllerchange',()=>{if(!had||done)return;done=true;location.reload()});sw.register('sw.js').catch(()=>{})}
</script>
