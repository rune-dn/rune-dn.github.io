<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>룬 대결</title>
<meta name="description" content="룬을 조합해 친구와 겨루는 동시 공개 대결">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e9ebee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a26" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="룬 사전">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=Noto+Serif+KR:wght@500;700&family=Noto+Sans+Runic&display=swap">
<style>
/* 레이아웃: 위에 상대, 가운데 지난 라운드 결과, 아래에 나와 손패. 한 손으로 위아래만 훑는 세로 한 줄 */
:root{
  --bg:#e9ebee;--card:#f6f7f9;--ink:#1c2230;--mute:#566074;--line:#cfd4dc;--rune:#243049;--accent:#9a6a18;
  --el:#1b767c;--buf:#b0560f;--heal:#2e7a39;--ctl:#2f5cb0;--mys:#a8367a;--fo:#7a4fb0;
  --good:#2e7a39;--warn:#a86a10;--bad:#c2414b;
  --f-body:'Noto Serif KR','Gowun Batang',serif;--f-title:'Hahmlet','Noto Serif KR',serif;--f-rune:'Noto Sans Runic','Segoe UI Historic','Segoe UI Symbol',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a26;--card:#1d2536;--ink:#e6e9f0;--mute:#9aa4b8;--line:#2c3650;--rune:#dfe6f5;--accent:#e0b058;--el:#52c3c9;--buf:#f0a35a;--heal:#72c77f;--ctl:#86a8f2;--mys:#f08cc4;--fo:#b995ec;--good:#72c77f;--warn:#e0b058;--bad:#f07a82;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a26;--card:#1d2536;--ink:#e6e9f0;--mute:#9aa4b8;--line:#2c3650;--rune:#dfe6f5;--accent:#e0b058;--el:#52c3c9;--buf:#f0a35a;--heal:#72c77f;--ctl:#86a8f2;--mys:#f08cc4;--fo:#b995ec;--good:#72c77f;--warn:#e0b058;--bad:#f07a82;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--f-body);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:28px;margin:4px 0 2px;text-wrap:balance}
h2{font-size:19px;margin:0 0 8px}
/* 제목은 새긴 듯한 함렛, 본문은 또렷한 노토 세리프 */
h1,h2,.over .big{font-family:var(--f-title);font-weight:700}
p{margin:6px 0}
a{color:var(--accent)}
.sub{color:var(--mute);font-size:14px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.links{display:flex;gap:12px;font-size:14px}
button,input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--bad);border-color:var(--bad);background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 10px;font-size:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lobby{display:grid;gap:12px;margin-top:14px}
.lobby .panel p{color:var(--mute);font-size:14px}
#code-in{width:9.5em;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.msg{font-size:14px;color:var(--bad);min-height:1.2em}
.note{font-size:13px;color:var(--mute)}
.codebig{font:700 40px/1.1 var(--f-body);letter-spacing:.18em;font-variant-numeric:tabular-nums}
/* 대결 */
.bar-top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin:10px 0 8px}
.timer{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.timer.low{color:var(--bad)}
.who{display:grid;gap:6px}
.who-h{display:flex;justify-content:space-between;align-items:baseline}
.who-h b{font-size:17px}
.hpnum{font-variant-numeric:tabular-nums;font-weight:700}
.hp{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.hp i{display:block;height:100%;background:var(--good);transition:width .5s ease}
.hp i.mid{background:var(--warn)}.hp i.low{background:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--mute)}
.chip.on{color:var(--ink);border-color:var(--accent)}
.field{font-size:13px;text-align:center;color:var(--ink);border:1px dashed var(--accent);border-radius:999px;padding:4px 10px;justify-self:center}
.reveal h3{font-size:15px;margin:0 0 6px;color:var(--mute)}
.play-row{display:grid;grid-template-columns:3.2em 1fr;gap:4px 10px;align-items:baseline;margin:4px 0}
.play-row .lab{font-size:13px;color:var(--mute)}
.g{font-family:var(--f-rune);color:var(--rune);letter-spacing:2px}
.play-row .g{font-size:22px}
.play-row .nm{font-weight:700}
.play-row .meta{font-size:13px;color:var(--mute)}
.evs{margin:8px 0 0;padding-left:18px;font-size:14px}
.evs li{margin:2px 0}
.combo{display:grid;gap:6px}
.combo-g{font-family:var(--f-rune);font-size:32px;color:var(--rune);letter-spacing:4px;min-height:40px}
.combo-n{font-weight:700;font-size:17px}
.combo-m{font-size:14px;color:var(--mute)}
.combo-e{font-size:13px;color:var(--mute);margin:0;padding-left:18px}
.err{font-size:14px;color:var(--bad);font-weight:700}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;background:var(--card);cursor:pointer;font-size:13px;word-break:keep-all;text-align:center;touch-action:manipulation}
.card b{font:400 30px/1.15 var(--f-rune);color:var(--rune)}
.card.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--bg)}
.card .ord{font-size:11px;color:var(--accent);font-weight:700;min-height:1em}
/* 카드 맨 위에 원소·효과·형태, 고른 순서는 오른쪽 위 모서리에 */
.card{position:relative}
.card .cat{font-size:11px;font-weight:700;line-height:1.2;color:var(--c);letter-spacing:.04em}
.card .ord{position:absolute;top:5px;right:7px;min-height:0;font-size:12px;line-height:1}
.card:disabled{opacity:.4;cursor:default}
.card[data-g="원소"]{--c:var(--el)}.card[data-g="강화"]{--c:var(--buf)}.card[data-g="회복·보호"]{--c:var(--heal)}.card[data-g="제어"]{--c:var(--ctl)}.card[data-g="신비"]{--c:var(--mys)}.card[data-g="형태"]{--c:var(--fo)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1 1 auto}
.padbox{display:flex;gap:8px;justify-content:center;align-items:flex-start}
#pad{touch-action:none;background:var(--bg);border:1px solid var(--line);border-radius:12px;cursor:crosshair;flex:none}
.padside{width:76px;display:flex;flex-direction:column;gap:6px}
.padside .btn{padding:8px 4px}
.padres{font-size:13px;color:var(--mute);min-height:2.6em}
.alt{display:flex;flex-direction:column;align-items:center;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:12px}
.alt b{font:400 22px/1.1 var(--f-rune);color:var(--rune)}
.wait{font-size:14px;color:var(--mute)}
.over{text-align:center}
.over .big{font-size:34px;font-weight:700;margin:6px 0}
.ov{position:fixed;inset:0;background:rgba(10,14,22,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.ov .panel{max-width:440px;width:100%}
@media (prefers-reduced-motion:reduce){.hp i{transition:none}}
/* 결과 창: 이긴 쪽은 승리, 진 쪽은 패배, 같으면 무승부 모션. 이미지처럼 언제나 어두운 바탕 */
.ov.res-ov{background:rgba(8,11,18,.82)}
.res{position:relative;overflow:hidden auto;max-height:100%;width:100%;max-width:440px;box-sizing:border-box;border-radius:18px;border:1px solid #2c3650;padding:26px 20px 22px;text-align:center;color:#e6e9f0;display:flex;flex-direction:column;align-items:center;gap:12px;--em:min(240px,60vw,34vh);--after:1.9s}
.res.win{background:#141a26;--after:1.6s}.res.lose{background:#0f131b;--after:2.3s}.res.draw{background:#121722;--after:2s}
.res-glow{position:absolute;inset:0;pointer-events:none}
.res.win .res-glow{background:radial-gradient(circle at 50% 30%,rgba(224,176,88,.22) 0,rgba(224,176,88,.06) 34%,rgba(20,26,38,0) 62%)}
.res.lose .res-glow{background:radial-gradient(circle at 50% 30%,rgba(134,168,242,.09) 0,rgba(15,19,27,0) 58%)}
.res.draw .res-glow{background:radial-gradient(circle at 50% 30%,rgba(201,196,170,.11) 0,rgba(18,23,34,0) 58%)}
.res>:not(.res-glow){position:relative}
.res-art{display:flex;flex-direction:column;align-items:center;gap:12px}
.res-em{position:relative;width:var(--em);height:var(--em)}
.res-em svg{position:absolute;left:0;top:0;width:100%;height:100%}
.res-g{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.res-g span,.res-half span{display:block;font-family:var(--f-rune);font-size:calc(var(--em)*.4);line-height:1}
.res-burst{position:absolute;left:13.3%;top:13.3%;width:73.4%;height:73.4%;box-sizing:border-box;border:2px solid #e0b058;border-radius:50%;opacity:0}
.res-half{position:absolute;top:0;width:50%;height:100%;overflow:hidden}
.res-half>div{width:200%;height:100%;display:flex;align-items:center;justify-content:center}
.res-half.r{left:50%}.res-half.r>div{margin-left:-100%}
.res-title{margin:0;font-family:var(--f-title);font-weight:700;font-size:clamp(52px,15vw,80px);line-height:1;letter-spacing:.18em;margin-right:-.18em}
.res.draw .res-title{letter-spacing:.12em;margin-right:-.12em}
.res-bar{display:flex}.res-bar i{display:block;width:32px;height:3px}
.res-rune{margin:0;font-size:14px;color:#9aa4b8}
.res-rune b{font-family:var(--f-rune);font-weight:400;letter-spacing:.14em}
.res-score{margin:4px 0 0;font-size:15px;color:#c9cfdb}
.res .row{justify-content:center}
.res .btn{background:transparent;color:#e6e9f0;border-color:#3e4862}
.res .btn.main{background:#e0b058;color:#141a26;border-color:#e0b058}
.res .note{margin:0;color:#9aa4b8}
@keyframes rFade{from{opacity:0}to{opacity:1}}
@keyframes rUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rVRing{from{opacity:0;transform:rotate(-70deg) scale(.82)}to{opacity:1;transform:none}}
@keyframes rSpin{to{transform:rotate(360deg)}}
@keyframes rBurst{0%{opacity:0;transform:scale(.45)}25%{opacity:.9}100%{opacity:0;transform:scale(1.7)}}
@keyframes rVGlyph{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.14)}100%{opacity:1;transform:scale(1)}}
@keyframes rVGlow{0%,100%{text-shadow:0 0 22px rgba(224,176,88,.5)}50%{text-shadow:0 0 44px rgba(224,176,88,.95)}}
@keyframes rVRise{from{opacity:0;transform:translateY(22px);letter-spacing:.45em;margin-right:-.45em}to{opacity:1;transform:none;letter-spacing:.18em;margin-right:-.18em}}
@keyframes rDRing{from{opacity:0;transform:scale(1.08)}to{opacity:1;transform:none}}
@keyframes rDGlyph{0%{opacity:0;transform:translate(0,-46px) rotate(0deg)}50%{opacity:1;transform:translate(0,10px) rotate(0deg)}62%{transform:translate(4px,8px) rotate(-10deg)}78%{transform:translate(4px,8px) rotate(-3deg)}100%{opacity:1;transform:translate(4px,8px) rotate(-6deg)}}
@keyframes rCrack{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes rShake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes rDrop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes rBarX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rLs{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:none}}
@keyframes rRs{from{opacity:0;transform:translateX(46px)}to{opacity:1;transform:none}}
@keyframes rL{from{opacity:0;transform:translateX(-15%)}to{opacity:1;transform:none}}
@keyframes rR{from{opacity:0;transform:translateX(15%)}to{opacity:1;transform:none}}
@keyframes rLine{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes rPop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.r-bg{animation:rFade 1.2s ease-out both}
.r-vring{animation:rVRing 1.1s cubic-bezier(.2,.8,.2,1) both}
.r-vspin{transform-origin:150px 150px;animation:rSpin 90s linear 1.1s infinite}
.r-vburst{animation:rBurst 1s ease-out .55s both}
.r-vglyph{animation:rVGlyph .8s cubic-bezier(.3,1.4,.5,1) .35s both,rVGlow 2.6s ease-in-out 1.3s infinite}
.r-vtitle{animation:rVRise .9s cubic-bezier(.2,.8,.2,1) .75s both}
.r-vsub{animation:rUp .6s ease-out 1.3s both}
.r-dring{animation:rDRing .8s ease-out both}
.r-dglyph{animation:rDGlyph 1.1s ease-in .2s both}
.r-dshake{animation:rShake .45s ease-out 1.05s both}
.r-c1{stroke-dasharray:1;animation:rCrack .45s ease-out 1.05s both}
.r-c2{stroke-dasharray:1;animation:rCrack .3s ease-out 1.4s both}
.r-c3{stroke-dasharray:1;animation:rCrack .3s ease-out 1.5s both}
.r-dtitle{animation:rDrop .8s ease-out 1.5s both}
.r-dbar{transform-origin:center;animation:rBarX .5s ease-out 1.9s both}
.r-dsub{animation:rFade .6s ease-out 2.1s both}
.r-tl{animation:rLs 1s cubic-bezier(.2,.8,.2,1) .1s both}
.r-tr{animation:rRs 1s cubic-bezier(.2,.8,.2,1) .1s both}
.r-tgl{animation:rL .9s cubic-bezier(.2,.8,.2,1) .35s both}
.r-tgr{animation:rR .9s cubic-bezier(.2,.8,.2,1) .35s both}
.r-tline{transform-origin:150px 150px;animation:rLine .5s ease-out 1.05s both}
.r-ttitle{animation:rPop .8s ease-out 1.2s both}
.r-tbl{transform-origin:right center;animation:rBarX .45s ease-out 1.6s both}
.r-tbr{transform-origin:left center;animation:rBarX .45s ease-out 1.6s both}
.r-tsub{animation:rFade .6s ease-out 1.8s both}
.r-after{animation:rUp .5s ease-out var(--after) both}
@media (prefers-reduced-motion:reduce){.res *{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>룬 대결</h1><div class="sub">룬을 조합해 동시에 공개하고, 상대 체력 100을 먼저 0으로 만들면 이겨요.</div></div>
    <div class="links"><a href="index.html">룬 사전</a><a href="rules.html">규칙서</a></div>
  </div>

  <section id="v-lobby" class="lobby">
    <div class="panel stack">
      <h2>친구와 대결</h2>
      <div class="row"><button class="btn main" id="b-create" type="button" disabled>방 만들기</button></div>
      <div class="row"><input id="code-in" maxlength="6" placeholder="코드 6자리" autocomplete="off" aria-label="방 코드"><button class="btn" id="b-join" type="button" disabled>입장</button></div>
      <div class="msg" id="lobby-msg" role="status"></div>
      <p id="net-note">연결을 확인하는 중이에요.</p>
      <div class="row" id="resume-row" hidden><button class="btn sm" id="b-resume" type="button">지난 방으로 돌아가기</button><span class="note" id="resume-code"></span></div>
    </div>
    <div class="panel stack">
      <h2>혼자 연습</h2>
      <p>컴퓨터와 같은 규칙으로 대결해요. 제한 시간은 없어요.</p>
      <div class="row"><button class="btn" id="b-practice" type="button">컴퓨터와 연습</button></div>
    </div>
  </section>

  <section id="v-wait" hidden>
    <div class="panel stack" style="margin-top:14px">
      <h2>대결 방</h2>
      <div class="codebig" id="w-code"></div>
      <div class="row"><button class="btn sm" id="b-copy" type="button">코드 복사</button><span class="note" id="copy-msg"></span></div>
      <p class="wait" id="w-status"></p>
      <div class="row"><button class="btn main" id="b-start" type="button" hidden>시작</button><button class="btn" id="b-leave1" type="button">방 나가기</button></div>
    </div>
  </section>

  <section id="v-play" hidden>
    <div class="bar-top"><span id="round-lab"></span><span class="timer" id="timer"></span></div>
    <div class="stack">
      <div class="panel who" id="opp"></div>
      <div class="field" id="field" hidden></div>
      <div class="panel reveal" id="reveal" hidden></div>
      <div class="panel who" id="me"></div>
      <div class="panel combo" id="combo"></div>
      <div class="hand" id="hand"></div>
      <div class="panel" id="padpanel" hidden>
        <div class="padbox"><canvas id="pad" aria-label="룬을 새기는 판"></canvas><div class="padside" id="padside"><button class="btn sm" id="pad-go" type="button">알아보기</button><button class="btn sm" id="pad-clear" type="button">지우기</button></div></div>
        <div class="padres" id="padres" aria-live="polite">손패에 있는 룬을 하나 그리고 잠시 기다리면 조합에 넣어요.</div>
      </div>
      <div class="acts">
        <button class="btn" id="b-pad" type="button">각인</button>
        <button class="btn" id="b-undo" type="button">되돌리기</button>
        <button class="btn" id="b-clear" type="button">비우기</button>
        <button class="btn" id="b-pass" type="button">재정비</button>
        <button class="btn main" id="b-confirm" type="button">확정</button>
      </div>
      <p class="wait" id="wait-msg" role="status"></p>
      <div class="row"><button class="btn sm warn" id="b-leave2" type="button">대결 나가기</button></div>
    </div>
  </section>

  <div class="ov res-ov" id="over" hidden><div class="res" id="res" role="dialog" aria-modal="true" aria-labelledby="over-title">
    <div class="res-glow r-bg"></div>
    <div class="res-art" id="res-art"></div>
    <p class="res-score r-after" id="over-sub"></p>
    <div class="row r-after"><button class="btn main" id="b-again" type="button">다시 하기</button><button class="btn" id="b-lobby" type="button">처음으로</button></div>
    <p class="note r-after" id="over-note"></p>
  </div></div>
</div>

<script src="firebase-config.js"></script>
<script>
/* ───── 룬 데이터 (사전과 같아요) ───── */

function nameOf(ix){
  if(!ix.length)return '재정비';
  const s=ix.slice().sort((a,b)=>a-b),k=s.join(',');
  if(NAMES[k])return NAMES[k];
  let n=NAMES[s[0]+','+s[1]];const ex=s.slice(2);
  if(ex[1]!=null)n=MOD[ex[1]][1]+' '+n;
  n=MOD[ex[0]][0]+' '+n;
  if(ex[2]!=null)n+='의 '+MOD[ex[2]][2];
  return n;
}

    else if(k==='잠재력')p*=(e.includes('바람')||e.includes('번개'))?2:1.2;

  const C0={h:sub.h||[],g:sub.g||[]},hp0={h:P.h.hp,g:P.g.hp};
  const pure={h:has(C0.h,'정화'),g:has(C0.g,'정화')},blocked=s=>pure[O[s]];
  for(const s of SEATS)if(pure[s]){const n=Math.min(PURE_HEAL,HPMAX-P[s].hp);P[s].hp+=n;E.push(`@${s}의 정화: 체력 ${n} 회복`)}
  const C={h:C0.h.slice(),g:C0.g.slice()};
  for(const s of SEATS)if(has(C0[s],'변환')&&C0[O[s]].length){
    if(blocked(s))E.push(`@${O[s]}의 정화가 @${s}의 변환을 막았어요`);
    else{const t=transform(C0[O[s]],C0[s]);if(t.join()!==C0[O[s]].join()){C[O[s]]=t;E.push(`@${s}의 변환: @${O[s]}의 원소가 ${[...new Set(els(t))].join('·')}(으)로 바뀌었어요`)}}
  }
  let stopped=false;
  for(const s of SEATS)if(has(C[s],'정지')){P[s].stops++;if(blocked(s))E.push(`@${O[s]}의 정화가 @${s}의 정지를 막았어요`);else stopped=true}
  const pw={h:power(C.h,P.h.bonus),g:power(C.g,P.g.bonus)};
  const rest={h:!C0.h.length,g:!C0.g.length};
  const dealt={h:0,g:0},heal={h:0,g:0},selfd={h:0,g:0},refl={h:0,g:0},oath={h:false,g:false};
  if(stopped){
    E.push('정지! 이번 라운드 양쪽 행동이 모두 취소됐어요');
    for(const s of SEATS)if(rest[s]){const n=Math.max(0,Math.min(REST_HEAL,HPMAX-P[s].hp));P[s].hp+=n;if(n>0)E.push(`@${s} 체력 ${n} 회복`)}
    for(const s of SEATS)if(attacks(C[s])&&has(C[s],'맹세'))oath[s]=true;
  }else{
    for(const s of SEATS)if(booms(C[s]).length){
      if(pure[s])E.push(`@${s}의 정화가 폭주 자기 피해를 막았어요`);
      else{selfd[s]=R(pw[s]/4);E.push(`@${s} 폭주(${booms(C[s]).map(p=>p.join('↔')).join(', ')}): 자기 피해 ${selfd[s]}`)}
    }
    for(const s of SEATS){
      const c=C[s],d=C[O[s]];if(!attacks(c))continue;
      const em=elemMult(c,d);let dm=pw[s]/DIV*em.m;const notes=em.notes.slice();
      if(S.field&&els(c).includes(S.field.el)){dm*=1.3;notes.push(`영역(${S.field.el}) ×1.3`)}
      if(has(c,'부활')){dm*=0.5;notes.push('부활 공격 ×0.5')}
      const hits=has(c,'환영')?2:1;let guard=has(d,'수호')?(has(d,'환영')?2:1):0;
      let shield=has(d,'방어')?R(pw[O[s]]/2):0,stolen=0,reduced=false,total=0;
      if(has(c,'흡수')&&shield>0){stolen=R(shield/2);shield-=stolen;notes.push(`흡수로 방어막 ${stolen} 빼앗음`)}
      for(let k=0;k<hits;k++){
        let x=dm*(k===0?1:0.5);
        if(has(c,'재앙')){if(guard||shield||has(d,'이동'))notes.push('재앙이 막기를 무시')}
        else{
          if(guard>0){guard--;x=0;reduced=true;notes.push('수호가 막음')}
          else{
            if(has(d,'이동')){x/=2;reduced=true;notes.push('이동으로 절반')}
            const b=Math.min(shield,x);if(b>0){shield-=b;x-=b;reduced=true;notes.push(`방어로 ${R(b)} 막음`)}
          }
        }
        total+=x;
      }
      dealt[s]=R(total);
      E.push(`@${s}의 공격${hits>1?'(환영 2번)':''} → @${O[s]}에게 ${dealt[s]} 피해`+(notes.length?` (${[...new Set(notes)].join(', ')})`:''));
      if(has(c,'맹세')&&reduced)oath[s]=true;
      if(has(c,'흡수'))heal[s]+=stolen||R(dealt[s]/2);
    }
    for(const s of SEATS)if(has(C[s],'정신')){
      if(blocked(s))E.push(`@${O[s]}의 정화가 @${s}의 정신 연결을 막았어요`);
      else if(dealt[O[s]]>0){refl[O[s]]+=dealt[O[s]];E.push(`@${s}의 정신 연결: @${O[s]}도 ${dealt[O[s]]} 피해`)}
    }
    for(const s of SEATS)if(has(C[s],'치유'))heal[s]+=R(pw[s]/HEALDIV*(els(C[s]).includes('나무')?1.5:1));
    for(const s of SEATS)if(rest[s])heal[s]+=REST_HEAL;
    for(const s of SEATS){
      P[s].hp-=dealt[O[s]]+selfd[s]+refl[s];
      if(heal[s]){const n=Math.max(0,Math.min(heal[s],HPMAX-P[s].hp));P[s].hp+=n;if(n>0)E.push(`@${s} 체력 ${n} 회복`)}
    }
  }
  const nextLimit={h:5,g:5};
  for(const s of SEATS){
    const p=P[s],c=C[s];p.bonus=1;
    if(has(c,'계약')){p.hp-=10;p.bonus*=2;E.push(`@${s}의 계약: 체력 10을 내고 다음 라운드 위력 ×2`)}
    if(oath[s]){p.bonus*=2;E.push(`@${s}의 맹세: 다음 라운드 위력 ×2`)}
    if(has(c,'속박')){if(blocked(s))E.push(`@${O[s]}의 정화가 @${s}의 속박을 막았어요`);else{nextLimit[O[s]]=1;E.push(`@${s}의 속박: 다음 라운드 @${O[s]}는 룬 1개만`)}}
    if(rest[s]){p.extra=1;E.push(`@${s}의 재정비: 다음 라운드 손패 8개`)}
    else p.extra=0;
    p.lastGuard=has(c,'수호');p.lastBind=has(c,'속박');
    if(has(c,'부활')){p.reviveReady=true;E.push(`@${s}의 부활이 대기 중이에요`)}
    p.foresight=has(c,'예언');
    if(!stopped&&has(c,'소환')&&els(c).length){const anc=has(c,'원초적 힘');p.spirit={dmg:R(pw[s]/SPIRIT_DIV)*(anc?2:1),turns:anc?4:3,anc};E.push(`@${s}의 ${anc?'고대 정령':'정령'} 소환: ${p.spirit.turns}라운드 동안 ${p.spirit.dmg} 피해`)}
    if(!stopped&&has(c,'영역')&&els(c).length){S.field={el:els(c)[0],turns:3,by:s};E.push(`@${s}의 영역: 3라운드 동안 ${S.field.el} 공격 ×1.3`)}
  }
  P.h.limit=nextLimit.h;P.g.limit=nextLimit.g;
  for(const s of SEATS){const p=P[s];if(p.spirit){P[O[s]].hp-=p.spirit.dmg;E.push(`@${s}의 정령 → @${O[s]}에게 ${p.spirit.dmg} 피해`);p.spirit.turns--;if(p.spirit.turns<=0)p.spirit=null}}
  if(S.field){S.field.turns--;if(S.field.turns<=0){S.field=null;E.push('영역이 사라졌어요')}}
  for(const s of SEATS){const p=P[s];if(p.hp<=0&&p.reviveReady){p.hp=REVIVE_HP;p.reviveReady=false;p.reviveUsed=true;E.push(`@${s} 부활! 체력 ${REVIVE_HP}`)}}
  /* 라운드가 끝나면 쓴 룬과 남은 손패를 모두 버려요. 다음 라운드에 새로 7개를 받아요 */
  for(const s of SEATS){const p=P[s];p.disc.push(...p.hand);p.hand=[]}
  S.last={round:S.round,play:C0,shown:C,pw,hp0,hp1:{h:P.h.hp,g:P.g.hp},events:E};
  const hd=P.h.hp<=0,gd=P.g.hp<=0;
  if(hd||gd)S.over={winner:hd&&gd?(P.h.hp>P.g.hp?'h':P.g.hp>P.h.hp?'g':'draw'):(hd?'g':'h'),reason:hd&&gd?'double':'ko'};
  else{S.round++;draw(P.h);draw(P.g)}
  return S;
}

function aiValue(c,me,op,field,known){
  const p=power(c,me.bonus),k=kw(c);let v=0,opd=12;
  if(known&&!attacks(known))opd=2;
  if(attacks(c)){
    let m=known?elemMult(c,known).m:1;if(field&&els(c).includes(field.el))m*=1.3;
    let d=p/DIV*m*(k.includes('환영')?1.5:1)*(k.includes('부활')?0.5:1);
    if(known&&(has(known,'수호')||has(known,'정지'))&&!k.includes('재앙'))d*=has(known,'정지')?0.1:0.4;
    v+=d+(k.includes('재앙')?3:0)+(k.includes('흡수')?d/2:0)+(k.includes('맹세')?3:0);
    if(d>=op.hp)v+=30;
  }
  if(k.includes('치유'))v+=Math.min(HPMAX-me.hp,p/HEALDIV*(els(c).includes('나무')?1.5:1))*(me.hp<50?1.4:0.5);
  if(k.includes('수호'))v+=opd*(k.includes('환영')?2:1)*0.75;
  if(k.includes('방어'))v+=Math.min(p/2,opd)*0.75;
  if(k.includes('이동'))v+=opd*0.4;
  if(k.includes('부활'))v+=me.hp<40?25:6;
  if(k.includes('정지'))v+=opd*0.6-(attacks(c)?p/DIV:0)+(me.hp<op.hp?5:0);
  if(k.includes('속박'))v+=8;
  if(k.includes('계약'))v+=me.hp>30?7:-10;
  if(k.includes('정신'))v+=opd*0.6*(me.hp>op.hp?1:0.3);
  if(k.includes('예언'))v+=3;
  if(k.includes('변환'))v+=5;
  if(k.includes('정화'))v+=Math.min(PURE_HEAL,HPMAX-me.hp)+3+(booms(c).length?4:0);
  if(k.includes('소환')&&els(c).length)v+=R(p/SPIRIT_DIV)*(k.includes('원초적 힘')?8:3)*0.8;
  if(k.includes('영역')&&els(c).length)v+=p/DIV*0.3*2;
  if(booms(c).length&&!k.includes('정화'))v-=p/4;
  return v-c.length*0.1+Math.random()*4;
}
function aiChoose(me,op,field,known){
  let best=[],bv=-1e9;const h=me.hand;
  const rec=(start,cur)=>{
    if(cur.length){const c=cur.map(j=>h[j]);if(!comboError(c,me)){const v=aiValue(c,me,op,field,known);if(v>bv){bv=v;best=c}}}
    if(cur.length>=me.limit)return;
    for(let j=start;j<h.length;j++){if(j>start&&h[j]===h[j-1])continue;rec(j+1,[...cur,j])}
  };
  rec(0,[]);
  /* 재정비(체력 15 회복 + 다음 손패 8개)가 낼 수 있는 조합보다 나으면 재정비해요 */
  const restV=Math.min(REST_HEAL,HPMAX-me.hp)*(me.hp<50?1.4:0.5)+2+Math.random()*4;
  if(restV>bv)return [];
  return best;
}

  drawPad();
}
function drawPad(){
  const x=pad.ctx;if(!x)return;const s=pad.size,cs=getComputedStyle(document.documentElement);x.clearRect(0,0,s,s);
  if(!pad.strokes.length&&!pad.cur){x.fillStyle=cs.getPropertyValue('--mute').trim();x.font='500 14px "Noto Serif KR", serif';x.textAlign='center';x.fillText('여기에 룬을 새겨요',s/2,s/2)}
  x.strokeStyle=cs.getPropertyValue('--rune').trim();x.lineWidth=Math.max(4,s/45);x.lineCap='round';x.lineJoin='round';
  [...pad.strokes,...(pad.cur?[pad.cur]:[])].forEach(st=>{x.beginPath();st.forEach(([a,b],k)=>k?x.lineTo(a,b):x.moveTo(a,b));if(st.length===1)x.lineTo(st[0][0]+.1,st[0][1]);x.stroke()});
}
function freeSlots(){const h=A.S.P[A.seat].hand;return h.map((i,pos)=>({i,pos})).filter(o=>!A.sel.includes(o.pos))}
function readPad(){
  clearTimeout(pad.timer);const st=pad.strokes.filter(s=>s.length>1);pad.strokes=[];pad.cur=null;drawPad();
  if(!st.length||A.confirmed)return;
  const free=freeSlots(),glyphs=new Set(free.map(o=>D[o.i][0]));
  const r=recognizeRune(st).filter(x=>glyphs.has(x.g));
  const res=$('#padres');res.replaceChildren();
  const addG=g=>{const o=free.find(f=>D[f.i][0]===g);if(o&&A.sel.length<5){A.sel.push(o.pos);renderCombo();renderHand()}};
  if(!r.length){res.textContent='손패에 그 룬이 없어요.';return}
  const best=r[0];
  if(best.s<=REJECT){addG(best.g);res.append(`${best.g} ${D[KI[D.find(d=>d[0]===best.g)[2]]][2]} 넣었어요. `)}
  else res.append('알아보기 어려워요. ');
  const alts=(best.s<=REJECT?r.slice(1,4):r.slice(0,3));
  if(alts.length){res.append(best.s<=REJECT?'다른 룬이면: ':'혹시: ');alts.forEach(a=>{const b=el('button','alt');b.type='button';b.append(el('b',null,a.g),D.find(d=>d[0]===a.g)[2]);b.onclick=()=>{if(best.s<=REJECT)A.sel.pop();addG(a.g);res.textContent=`${a.g} ${D.find(d=>d[0]===a.g)[2]}(으)로 바꿨어요.`};res.append(b,' ')})}
}

function showOver(){

  /* 결과마다 한 번만 그려요. 같은 결과로 다시 불려도 모션이 처음부터 다시 돌지 않게 */
  const kind=draw_?'draw':win?'win':'lose',key=[A.kind,A.code||'',me,A.S.round,o.winner,o.reason,P.h.hp,P.g.hp].join('|');
  if($('#over').hidden||A.resKey!==key){A.resKey=key;$('#res').className='res '+kind;$('#res-art').innerHTML=RES_ART[kind]();

const FB='https://www.gstatic.com/firebasejs/10.12.2/';
/* Firestore를 지금까지 쓰던 doc().get/set/update/onSnapshot 모양으로 감싸요.
   대결 상태 S는 안에 배열이 겹쳐 있어서 글자로 바꿔 저장하고, 읽을 때 되돌려요. */
function makeDb(fs,db){
  const enc=o=>{const r={...o};if(r.S&&typeof r.S==='object')r.S=JSON.stringify(r.S);return r};
  const dec=d=>{if(d&&typeof d.S==='string'){try{d.S=JSON.parse(d.S)}catch(e){d.S=null}}return d};
  const wrap=s=>({exists:s.exists(),data:()=>dec(s.data())});
  return {doc(path){const r=fs.doc(db,path);return {
    get:async()=>wrap(await fs.getDoc(r)),
    set:o=>fs.setDoc(r,enc(o)),
    update:o=>fs.updateDoc(r,enc(o)),
    onSnapshot:(cb,err)=>fs.onSnapshot(r,s=>cb(wrap(s)),err)
  }}};
}
const within=(p,ms=12000)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
function fbMsg(e){
  const c=(e&&e.code)||'',m=String((e&&e.message)||'');
  if(c==='timeout')return '서버가 응답하지 않아요. 인터넷 연결을 확인하고 다시 시도해 주세요.';
  if(c==='permission-denied')return '저장이 거부됐어요. Firebase의 Firestore 보안 규칙을 게시했는지 확인해 주세요.';
  if(c==='not-found'||/does not exist/i.test(m))return 'Firestore 데이터베이스가 아직 없어요. Firebase 콘솔에서 Firestore Database를 만들어 주세요.';
  if(c==='unavailable')return '서버에 연결하지 못했어요. 인터넷 연결을 확인하고 다시 시도해 주세요.';
  return '저장하지 못했어요. 잠시 후 다시 시도해 주세요.'+(c?' ('+c+')':'');
}
function authMsg(e){
  const c=(e&&e.code)||'';
  if(c==='auth/admin-restricted-operation'||c==='auth/operation-not-allowed')return 'Firebase에서 익명 로그인이 꺼져 있어요. Authentication → 로그인 방법에서 익명을 사용 설정해 주세요. 컴퓨터와 연습은 바로 할 수 있어요.';
  if(c==='auth/unauthorized-domain')return '이 사이트 주소가 Firebase에 등록되어 있지 않아요. Authentication → 설정 → 승인된 도메인에 추가해 주세요.';
  if(/api-key/.test(c))return 'Firebase 설정값이 맞지 않아요. firebase-config.js를 다시 확인해 주세요. 컴퓨터와 연습은 바로 할 수 있어요.';
  if(c==='auth/network-request-failed'||(e instanceof TypeError))return '인터넷에 연결되지 않아 친구와 대결을 할 수 없어요. 연결되면 자동으로 다시 시도해요. 컴퓨터와 연습은 할 수 있어요.';
  return 'Firebase에 연결하지 못했어요'+(c?' ('+c+')':'')+'. 컴퓨터와 연습은 바로 할 수 있어요.';
}
async function initNet(){
  const cfg=typeof firebaseConfig!=='undefined'?firebaseConfig:null;
  if(!cfg||!cfg.apiKey||!cfg.projectId||/여기/.test(cfg.apiKey)){NET.state='nocfg';NET.ready=true;return refreshLobby()}
  NET.state='loading';refreshLobby();
  try{
    const [appM,authM,fs]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-auth.js'),import(FB+'firebase-firestore.js')]);
    const app=appM.getApps().length?appM.getApp():appM.initializeApp(cfg);
    const auth=authM.getAuth(app);
    /* 이 브라우저에 남아 있는 익명 계정을 먼저 찾고, 없으면 새로 만들어요(이어하기에 필요) */
    let user=await new Promise(r=>{const un=authM.onAuthStateChanged(auth,u=>{r(u);setTimeout(()=>un(),0)})});
    if(!user)user=(await authM.signInAnonymously(auth)).user;
    if(!NET.fs)NET.fs=fs.initializeFirestore(app,{ignoreUndefinedProperties:true});
    NET.db=makeDb(fs,NET.fs);NET.uid=user.uid;NET.state='on';NET.err=null;
  }catch(e){NET.state='err';NET.err=e;console.warn(e)}
  NET.ready=true;refreshLobby();
}
window.addEventListener('online',()=>{if(NET.state==='err')initNet()});
const CODE_CH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:6},()=>CODE_CH[Math.floor(Math.random()*CODE_CH.length)]).join('');
const roomRef=code=>NET.db.doc('duel/'+code);
const subRef=(code,s)=>NET.db.doc('duel/'+code+'/sub/'+s);
function lsGet(){try{return localStorage.getItem('rune-duel-room')}catch(e){return null}}
function lsSet(v){try{v?localStorage.setItem('rune-duel-room',v):localStorage.removeItem('rune-duel-room')}catch(e){}}
function netMsg(t){$('#lobby-msg').textContent=t}
const writeFail=fbMsg;
async function createRoom(){
  if(!NET.db||NET.busy)return;
  netMsg('');let code=null;NET.busy=true;refreshLobby();
  try{for(let t=0;t<5&&!code;t++){const c=genCode();const s=await within(roomRef(c).get());if(!s.exists)code=c}
    if(code)await within(roomRef(code).set({v:1,code,hostId:NET.uid,guestId:null,phase:'wait',S:null,deadline:0,at:Date.now()}));
  }catch(e){NET.busy=false;refreshLobby();return netMsg(fbMsg(e))}
  NET.busy=false;refreshLobby();
  if(!code)return netMsg('방을 만들지 못했어요. 다시 눌러 주세요.');
  joinAs(code,'h');
}
async function joinRoom(raw){
  const code=(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'');netMsg('');
  if(code.length!==6)return netMsg('코드 6자리를 입력해 주세요.');
  if(!NET.db)return netMsg('아직 서버에 연결되지 않았어요.');
  if(NET.busy)return;
  NET.busy=true;refreshLobby();
  const done=t=>{NET.busy=false;refreshLobby();if(t)netMsg(t)};
  let s;try{s=await within(roomRef(code).get())}catch(e){return done(fbMsg(e))}
  if(!s.exists)return done('그 코드의 방이 없어요. 코드를 다시 확인해 주세요.');
  const d=s.data();
  if(d.hostId===NET.uid){done();return joinAs(code,'h')}
  if(d.guestId&&d.guestId!==NET.uid)return done('이미 두 명이 들어간 방이에요.');
  if(!d.guestId){try{await within(roomRef(code).update({guestId:NET.uid}))}catch(e){
    /* 거의 동시에 다른 사람이 먼저 들어갔으면 규칙에 막혀요 */
    if(e&&e.code==='permission-denied'){try{const s2=await within(roomRef(code).get());const d2=s2.exists?s2.data():null;if(d2&&d2.guestId&&d2.guestId!==NET.uid)return done('이미 두 명이 들어간 방이에요.')}catch(_){}}
    return done(fbMsg(e))}}
  done();joinAs(code,'g');
}
function joinAs(code,seat){
  NET.unsub.forEach(u=>u());NET.unsub=[];
  A.kind='net';A.seat=seat;A.code=code;A.meta=null;A.S=null;A.subs={h:null,g:null};A.shownRound=0;lsSet(code);
  $('#w-code').textContent=code;show('wait');renderWaitRoom();
  NET.unsub.push(roomRef(code).onSnapshot(s=>onRoom(s.exists?s.data():null),()=>netMsg('방 연결이 끊겼어요.')));
  for(const s of ['h','g'])NET.unsub.push(subRef(code,s).onSnapshot(x=>{A.subs[s]=x.exists?x.data():null;if(A.mode==='play'){renderCombo();renderWait()}hostTick()},()=>{}));
}
function renderWaitRoom(){
  const m=A.meta;const st=$('#w-status'),start=$('#b-start');
  if(A.seat==='h'){start.hidden=false;start.disabled=!(m&&m.guestId);st.textContent=m&&m.guestId?'상대가 들어왔어요. 시작을 누르면 대결이 시작돼요.':'상대에게 코드를 알려주세요. 상대가 코드를 입력하면 여기에 표시돼요.'}
  else{start.hidden=true;st.textContent='방장이 시작하기를 기다리는 중이에요.'}
}
function onRoom(d){
  if(!d){netMsg('방이 사라졌어요.');return leave()}
  A.meta=d;
  if(d.phase==='wait'||!d.S){if(A.mode!=='wait')show('wait');renderWaitRoom();return}
  const newRound=!A.S||d.S.round!==A.S.round||(!!d.S.over)!==(!!(A.S&&A.S.over))||(d.S.last&&(!A.S.last||d.S.last.round!==A.S.last.round));
  A.S=d.S;A.deadline=d.deadline;
  if(newRound&&A.shownRound!==d.S.round+(d.S.over?100:0)){A.sel=[];A.confirmed=false;A.shownRound=d.S.round+(d.S.over?100:0);if(d.S.last)window.scrollTo({top:0,behavior:'smooth'})}
  const mine=A.subs[A.seat];if(mine&&mine.round===d.S.round&&!d.S.over)A.confirmed=true;
  if(A.mode!=='play')show('play');
  renderPlay();showOver();
}
async function hostStart(){
  if(A.seat!=='h'||!A.meta||!A.meta.guestId)return;
  const S=newGame();
  try{await within(roomRef(A.code).set({...A.meta,phase:'play',S,deadline:Date.now()+ROUND_MS,at:Date.now()}))}catch(e){const t=fbMsg(e);netMsg(t);$('#w-status').textContent=t;$('#wait-msg').textContent=t}
}
$('#b-start').onclick=hostStart;
async function netSubmit(c){try{await subRef(A.code,A.seat).set({round:A.S.round,combo:c,at:Date.now()})}catch(e){A.confirmed=false;$('#wait-msg').textContent=writeFail(e);renderCombo()}}
/* 방장만 라운드를 계산해서 저장해요. 둘 다 확정했거나 시간이 지나면 계산 */
async function hostTick(){
  if(A.kind!=='net'||A.seat!=='h'||A.resolving||!A.meta||A.meta.phase!=='play'||!A.S||A.S.over)return;
  const S=A.S,ok=s=>A.subs[s]&&A.subs[s].round===S.round;
  if(!(ok('h')&&ok('g'))&&Date.now()<A.deadline+1500)return;
  const pick=s=>{if(!ok(s))return [];const c=(A.subs[s].combo||[]).filter(i=>Number.isInteger(i)&&i>=0&&i<29);return comboError(c,S.P[s])?[]:c};
  A.resolving=true;
  try{const S2=resolve(S,{h:pick('h'),g:pick('g')});await roomRef(A.code).set({...A.meta,phase:S2.over?'over':'play',S:S2,deadline:S2.over?0:Date.now()+ROUND_MS,at:Date.now()})}
  catch(e){$('#wait-msg').textContent=writeFail(e)}
  A.resolving=false;
}
setInterval(()=>{
  if(A.kind==='net'&&A.mode==='play'&&A.S&&!A.S.over&&A.deadline){const left=Math.max(0,Math.ceil((A.deadline-Date.now())/1000));const t=$('#timer');t.textContent=`${left}초`;t.classList.toggle('low',left<=10);
    if(left===0&&!A.confirmed){A.confirmed=true;$('#wait-msg').textContent='시간이 지나 이번 라운드는 재정비해요.';renderCombo();renderHand()}}
  hostTick();
},500);
function leave(){NET.unsub.forEach(u=>u());NET.unsub=[];if(A.kind==='net')lsSet(null);A.kind=null;A.S=null;$('#over').hidden=true;show('lobby');refreshLobby()}
$('#b-create').onclick=createRoom;
$('#b-join').onclick=()=>joinRoom($('#code-in').value);
$('#code-in').addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom(e.target.value)});
$('#b-copy').onclick=async()=>{try{await navigator.clipboard.writeText(A.code);$('#copy-msg').textContent='복사했어요'}catch(e){const r=document.createRange();r.selectNodeContents($('#w-code'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('#copy-msg').textContent='코드를 길게 눌러 복사하세요'}};
$('#b-resume').onclick=()=>joinRoom(lsGet());
function refreshLobby(){
  const on=!!(NET.db&&NET.uid);
  $('#b-create').disabled=!on||NET.busy;$('#b-join').disabled=!on||NET.busy;
  const notes={loading:'서버에 연결하는 중이에요.',on:'방을 만들어 코드를 보내거나, 받은 코드를 입력하세요. 상대는 이 페이지를 열고 코드만 넣으면 돼요.',
    nocfg:'친구와 대결을 하려면 firebase-config.js에 Firebase 설정값을 넣어야 해요. 컴퓨터와 연습은 바로 할 수 있어요.'};
  $('#net-note').textContent=NET.state==='err'?authMsg(NET.err):(notes[NET.state]||'');
  const last=lsGet();$('#resume-row').hidden=!(on&&last);$('#resume-code').textContent=last?`코드 ${last}`:'';
}
refreshLobby();
initNet();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){/* 앱 파일이 새 버전으로 바뀌면 한 번 자동으로 새로고침해요 (대결 중에는 하지 않아요) */const sw=navigator.serviceWorker,had=!!sw.controller;let done=false;sw.addEventListener('controllerchange',()=>{if(!had||done||A.kind==='net'||(A.kind==='ai'&&A.S&&!A.S.over))return;done=true;location.reload()});sw.register('sw.js').catch(()=>{})}
</script>
